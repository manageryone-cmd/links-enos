# Build configuration only.
#
# Distribution metadata lives in setup.cfg on purpose: setuptools < 61 (still
# common on Debian/Ubuntu system Python and in air-gapped CI images) does not
# read PEP 621 `[project]` tables and would produce an "UNKNOWN-0.0.0" wheel.
# setup.cfg is understood by every setuptools from 59 through 7x.

[build-system]
requires = ["setuptools>=59", "wheel"]
build-backend = "setuptools.build_meta"
