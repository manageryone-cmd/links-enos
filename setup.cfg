[metadata]
name = links-enos
version = 1.0.0
description = links-enos - a cross-platform, dependency-free MCP memory server (stdio transport)
long_description = file: MCP_INTEGRATION.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
author = links-enos contributors
keywords = mcp, memory, model-context-protocol, sqlite, agent, cline, cursor, claude
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Environment :: Console
    Intended Audience :: Developers
    Operating System :: OS Independent
    Topic :: Software Development :: Libraries :: Application Frameworks

[options]
packages = enos
py_modules = install_mcp
python_requires = >=3.8
include_package_data = True
zip_safe = False
# Intentionally empty: standard library only, which is what makes the
# single-file binary and the slim container image possible.
install_requires =

[options.entry_points]
console_scripts =
    links-enos = enos.mcp_server:main

[options.extras_require]
build =
    pyinstaller>=6.0

[options.package_data]
enos = py.typed
